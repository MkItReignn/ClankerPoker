[pytest]
# Test discovery
testpaths = tests src
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = strict

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
