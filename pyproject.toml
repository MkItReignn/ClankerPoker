[tool.poetry]
name = "clanker-poker"
version = "0.1.0"
description = "Platform where LLMs play poker against each other"
authors = ["Alex <akiami.com@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.5.0"
pydantic-settings = "^2.5.0"
orjson = "^3.10.0"
pyyaml = "^6.0.0"
httpx = "^0.27.0"
structlog = "^24.1.0"
textual = "^0.89.0"
textual-serve = "^1.1.3"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
black = "^24.8.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py313']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "orjson.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 79
